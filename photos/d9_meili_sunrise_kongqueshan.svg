<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <defs>
    <linearGradient id="sky9" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="35%" stop-color="#701a75"/>
      <stop offset="65%" stop-color="#c2410c"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="kawagarboGold" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky9)"/>
  <!-- Blazing Golden Dawn Sun (07:15 Sunrise) -->
  <circle cx="650" cy="180" r="130" fill="#fde047" opacity="0.35" filter="url(#glow)"/>
  <!-- Holy Kawagarbo (6,740m) & Meili 13 Peaks in Radiance -->
  <polygon points="350,380 600,105 720,240 850,150 1020,330 1200,240 1200,430 0,430" fill="url(#kawagarboGold)" filter="url(#shadow)"/>
  <polygon points="600,105 650,220 580,260" fill="#ffffff" opacity="0.95"/>
  <polygon points="850,150 900,240 830,260" fill="#ffffff" opacity="0.9"/>
  <!-- Flowing Sea of Clouds (澜沧江峡谷晨雾云海) -->
  <g fill="#ffffff" opacity="0.88">
    <ellipse cx="250" cy="380" rx="140" ry="32"/>
    <ellipse cx="450" cy="395" rx="180" ry="38"/>
    <ellipse cx="720" cy="385" rx="190" ry="35"/>
    <ellipse cx="980" cy="390" rx="160" ry="32"/>
  </g>
  <!-- Feilai Temple Eight Sacred White Stupas (飞来寺八座佛塔) -->
  <g transform="translate(180, 360)">
    <!-- Stupa 1 -->
    <g transform="translate(0, 0)">
      <rect x="15" y="45" width="30" height="25" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 12 45 Q 30 25 48 45 Z" fill="#f8fafc"/>
      <rect x="27" y="10" width="6" height="15" fill="#f59e0b"/>
      <circle cx="30" cy="8" r="4" fill="#fbbf24"/>
    </g>
    <!-- Stupa 2 -->
    <g transform="translate(60, -5)">
      <rect x="15" y="45" width="32" height="27" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 12 45 Q 31 23 50 45 Z" fill="#f8fafc"/>
      <rect x="28" y="8" width="6" height="16" fill="#f59e0b"/>
      <circle cx="31" cy="6" r="4.5" fill="#fbbf24"/>
    </g>
    <!-- Stupa 3 -->
    <g transform="translate(125, -10)">
      <rect x="15" y="45" width="35" height="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 11 45 Q 32 20 54 45 Z" fill="#f8fafc"/>
      <rect x="29" y="5" width="7" height="18" fill="#f59e0b"/>
      <circle cx="32.5" cy="3" r="5" fill="#fbbf24"/>
    </g>
    <!-- Stupa 4 -->
    <g transform="translate(195, -15)">
      <rect x="15" y="45" width="38" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 11 45 Q 34 18 57 45 Z" fill="#f8fafc"/>
      <rect x="30" y="2" width="8" height="20" fill="#f59e0b"/>
      <circle cx="34" cy="0" r="5.5" fill="#fbbf24"/>
    </g>
  </g>
  <!-- Sacred Juniper Incense Burner & White Smoke (煨桑炉青烟缭绕) -->
  <g transform="translate(880, 360)">
    <rect x="30" y="45" width="40" height="40" rx="6" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <polygon points="20,45 50,25 80,45" fill="#92400e"/>
    <!-- Rising aromatic white smoke plumes -->
    <path d="M 50 22 Q 40 -10 60 -40 T 45 -80 T 70 -120" stroke="#f8fafc" stroke-width="6" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M 55 22 Q 65 -5 50 -35 T 65 -75" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  <!-- Fluttering Wind Horse Prayer Flags (风马旗) in Foreground -->
  <g transform="translate(0, 160)">
    <path d="M 0 40 Q 400 120 1200 20" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
    <!-- Mini flags -->
    <polygon points="80,52 110,58 105,92 75,86" fill="#2563eb"/>
    <polygon points="120,60 150,66 145,100 115,94" fill="#ffffff"/>
    <polygon points="160,68 190,74 185,108 155,102" fill="#dc2626"/>
    <polygon points="200,75 230,80 225,114 195,109" fill="#16a34a"/>
    <polygon points="240,81 270,85 265,119 235,115" fill="#eab308"/>
  </g>

  <!-- Top Badges -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="460" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="64" y="59" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="19" font-weight="800">🌅 飞来寺 07:15 · 梅里日照金山与白塔煨桑</text>
    
    <rect x="1000" y="32" width="160" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="1080" y="59" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700">6,740m 卡瓦格博主峰</text>
  </g>
  <!-- Bottom Glassmorphism Editorial Info Card -->
  <g filter="url(#shadow)">
    <rect x="28" y="492" width="1144" height="155" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.5"/>
    <rect x="28" y="492" width="1144" height="6" rx="3" fill="#f59e0b"/>
    <text x="56" y="542" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="30" font-weight="900">飞来寺梅里雪山「日照金山」 &amp; 孔雀山垭口心形湖</text>
    <text x="56" y="582" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700">D8–D9 · 10/11–10/12 · 明珠拉卡酒店直面 6,740m 卡瓦格博</text>
    <text x="56" y="620" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18">🌅 飞来寺 07:15 日照金山 · 八座藏传白塔 · 煨桑炉松柏青烟与风马旗</text>
  </g>
</svg>