<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="wudiLake" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="45%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky6)"/>
  <!-- Distant Golden Autumn Mountain Ridge -->
  <polygon points="0,320 220,180 400,280 620,150 820,270 1050,160 1200,260 1200,420 0,420" fill="#f8fafc"/>
  <polygon points="620,150 710,240 610,290" fill="#fde047" opacity="0.6"/>
  <!-- Golden Larches and Green Firs around the lake -->
  <g fill="#eab308" opacity="0.9">
    <polygon points="120,380 140,290 160,380"/>
    <polygon points="150,385 170,300 190,385"/>
    <polygon points="280,390 300,310 320,390"/>
    <polygon points="880,380 900,295 920,380"/>
    <polygon points="915,385 935,305 955,385"/>
  </g>
  <!-- Pristine Tiffany Emerald Waters of Wudi Lake (沃迪错 3800m) -->
  <rect x="0" y="390" width="1200" height="130" fill="url(#wudiLake)"/>
  <ellipse cx="600" cy="460" rx="480" ry="45" fill="#2dd4bf" opacity="0.55"/>
  <path d="M 50 435 Q 350 420 650 440 T 1150 430" stroke="#ccfbf1" stroke-width="2.5" fill="none" opacity="0.75"/>
  <!-- Wooden Dock extending into water -->
  <polygon points="780,480 880,440 920,445 820,485" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <line x1="880" y1="440" x2="880" y2="465" stroke="#451a03" stroke-width="4"/>
  <line x1="920" y1="445" x2="920" y2="470" stroke="#451a03" stroke-width="4"/>
  <!-- Cute Black Tibetan Yak grazing by lake (憨态可掬的黑牦牛) -->
  <g transform="translate(240, 370)">
    <!-- Yak Body (shaggy black fur) -->
    <ellipse cx="80" cy="65" rx="50" ry="32" fill="#0f172a"/>
    <!-- Fur fringes bottom -->
    <path d="M 35 75 Q 45 95 55 75 Q 65 98 75 75 Q 85 98 95 75 Q 105 95 115 75 Q 125 95 130 75" fill="#020617"/>
    <!-- Legs -->
    <rect x="45" y="78" width="12" height="34" rx="5" fill="#0f172a"/>
    <rect x="62" y="80" width="12" height="32" rx="5" fill="#1e293b"/>
    <rect x="98" y="78" width="12" height="34" rx="5" fill="#0f172a"/>
    <rect x="114" y="80" width="12" height="32" rx="5" fill="#1e293b"/>
    <!-- Head lowered drinking water -->
    <ellipse cx="32" cy="62" rx="22" ry="16" fill="#0f172a"/>
    <!-- Large Curved Horns -->
    <path d="M 30 52 Q 10 35 15 15 Q 22 28 32 46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 38 52 Q 58 35 53 15 Q 46 28 36 46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Cute eye and snout -->
    <circle cx="24" cy="58" r="2.5" fill="#ffffff"/>
    <ellipse cx="18" cy="68" rx="5" ry="3.5" fill="#334155"/>
    <!-- Shaggy forehead tuft -->
    <path d="M 24 45 Q 30 32 36 45" fill="#1e293b"/>
  </g>
  <!-- Rustic Wooden Cabin with Gentle Chimney Smoke (湖畔牧民木屋) -->
  <g transform="translate(980, 335)">
    <!-- Log walls -->
    <rect x="20" y="35" width="85" height="55" fill="#92400e" stroke="#78350f" stroke-width="2"/>
    <!-- Gable Roof -->
    <polygon points="10,35 62,5 115,35" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <!-- Stone Chimney -->
    <rect x="85" y="10" width="14" height="25" fill="#475569"/>
    <!-- Door and glowing window -->
    <rect x="35" y="55" width="20" height="35" fill="#451a03"/>
    <rect x="70" y="50" width="18" height="18" rx="2" fill="#fde047"/>
    <!-- Cozy Smoke curls -->
    <path d="M 92 8 Q 98 -5 92 -20 T 100 -40" stroke="#f1f5f9" stroke-width="3" fill="none" opacity="0.75"/>
  </g>

  <!-- Top Badges -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="460" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="64" y="59" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="19" font-weight="800">🌲 香格里拉无底湖 · 蒂芙尼蓝与静谧黑牦牛</text>
    
    <rect x="1000" y="32" width="160" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="1080" y="59" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700">3,800m 沃迪错</text>
  </g>
  <!-- Bottom Glassmorphism Editorial Info Card -->
  <g filter="url(#shadow)">
    <rect x="28" y="492" width="1144" height="155" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.5"/>
    <rect x="28" y="492" width="1144" height="6" rx="3" fill="#f59e0b"/>
    <text x="56" y="542" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="30" font-weight="900">香格里拉无底湖 · 雪山森林环抱的翡翠冰蚀湖</text>
    <text x="56" y="582" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700">D6 · 10/09 · 海拔 3,800m · 连住独克宗格雅·雪印梵境</text>
    <text x="56" y="620" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18">🌲 蒂芙尼蓝绿翡翠湖面 · 悠闲黑牦牛 · 湖畔牧人木屋与木栈道</text>
  </g>
</svg>