<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky1)"/>
  <!-- Sunset Glow on Jade Dragon Snow Mountain -->
  <circle cx="850" cy="220" r="140" fill="url(#sun1)"/>
  <!-- Distant Snow Peaks -->
  <polygon points="480,360 680,140 760,230 880,120 1020,280 1200,190 1200,480 480,480" fill="#f8fafc" opacity="0.95"/>
  <polygon points="680,140 760,230 730,360 620,360" fill="#fde047" opacity="0.5"/>
  <polygon points="880,120 950,220 900,320 830,300" fill="#fde047" opacity="0.6"/>
  <!-- Dark Mountain Silhouette -->
  <polygon points="0,420 220,330 460,400 750,330 1050,380 1200,350 1200,520 0,520" fill="#1e293b"/>
  <!-- Traditional Naxi Roofs & Pagoda (Lion Mountain Wangu Tower) -->
  <g fill="#0f172a" stroke="#334155" stroke-width="1.5">
    <!-- Wangu Tower silhouette -->
    <path d="M 280 340 L 320 310 L 360 340 Z"/>
    <rect x="295" y="340" width="50" height="30"/>
    <path d="M 260 370 L 320 340 L 380 370 Z"/>
    <rect x="280" y="370" width="80" height="35"/>
    <path d="M 240 405 L 320 370 L 400 405 Z"/>
    <!-- Naxi Eaves left -->
    <path d="M 0 440 Q 60 410 140 440 L 140 520 L 0 520 Z"/>
    <path d="M 120 420 Q 200 390 280 430 L 280 520 L 120 520 Z"/>
  </g>
  <!-- Grand Waterwheel (丽江大水车) -->
  <g transform="translate(140, 360)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#78350f" stroke-width="8"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#92400e" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#b45309"/>
    <!-- Spokes -->
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#b45309" stroke-width="4"/>
    <line x1="0" y1="-75" x2="0" y2="75" stroke="#b45309" stroke-width="4"/>
    <line x1="-53" y1="-53" x2="53" y2="53" stroke="#b45309" stroke-width="4"/>
    <line x1="-53" y1="53" x2="53" y2="-53" stroke="#b45309" stroke-width="4"/>
    <!-- Waterwheel paddles -->
    <rect x="65" y="-12" width="16" height="24" rx="3" fill="#d97706"/>
    <rect x="-81" y="-12" width="16" height="24" rx="3" fill="#d97706"/>
    <rect x="-12" y="65" width="24" height="16" rx="3" fill="#d97706"/>
    <rect x="-12" y="-81" width="24" height="16" rx="3" fill="#d97706"/>
  </g>
  <!-- Flowing Yuhe River Stream with reflections -->
  <path d="M 0 440 Q 150 430 300 450 T 600 445 T 900 460 T 1200 450 L 1200 530 L 0 530 Z" fill="#0284c7" opacity="0.6"/>
  <path d="M 50 470 Q 200 455 380 475 T 750 470 T 1150 480" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- Cozy Glowing Red/Orange Lanterns (纳西古城红灯笼) -->
  <g filter="url(#glow)">
    <circle cx="340" cy="400" r="16" fill="#ef4444"/>
    <circle cx="340" cy="400" r="9" fill="#fde047"/>
    <circle cx="440" cy="420" r="18" fill="#ef4444"/>
    <circle cx="440" cy="420" r="10" fill="#fde047"/>
    <circle cx="560" cy="415" r="15" fill="#f97316"/>
    <circle cx="560" cy="415" r="8" fill="#fef08a"/>
    <circle cx="680" cy="435" r="17" fill="#ef4444"/>
    <circle cx="680" cy="435" r="9" fill="#fde047"/>
  </g>
  <!-- Naxi Windchimes / Dongba Wooden Plaques -->
  <g stroke="#d97706" stroke-width="2">
    <line x1="380" y1="410" x2="380" y2="445"/>
    <rect x="372" y="445" width="16" height="24" rx="2" fill="#b45309" stroke="none"/>
    <line x1="405" y1="415" x2="405" y2="455"/>
    <rect x="397" y="455" width="16" height="24" rx="2" fill="#92400e" stroke="none"/>
  </g>

  <!-- Top Badges -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="460" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="64" y="59" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="19" font-weight="800">🏮 丽江古城 · 纳西风情与大水车</text>
    
    <rect x="1000" y="32" width="160" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="1080" y="59" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700">5,596m 玉龙主峰</text>
  </g>
  <!-- Bottom Glassmorphism Editorial Info Card -->
  <g filter="url(#shadow)">
    <rect x="28" y="492" width="1144" height="155" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.5"/>
    <rect x="28" y="492" width="1144" height="6" rx="3" fill="#f59e0b"/>
    <text x="56" y="542" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="30" font-weight="900">丽江大研古城与玉龙雪山远眺</text>
    <text x="56" y="582" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700">D1 · 10/04 · 海拔 2,400m · 高原适应首站</text>
    <text x="56" y="620" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18">📷 狮子山万古楼暮色 · 纳西大水车 · 许愿风铃长廊</text>
  </g>
</svg>