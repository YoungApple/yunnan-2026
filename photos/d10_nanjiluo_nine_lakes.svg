<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <defs>
    <linearGradient id="sky10" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="75%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="lakeTurquoise" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="60%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky10)"/>
  <!-- Biluo Snow Mountain Cirque Cliffs (碧罗雪山冰蚀岩壁) -->
  <polygon points="0,320 180,140 380,260 580,100 800,240 1020,120 1200,250 1200,430 0,430" fill="#134e4a"/>
  <!-- Morning Sun Beams piercing mist (上帝之光/丁达尔光束) -->
  <g fill="#fef08a" opacity="0.18">
    <polygon points="580,100 480,480 540,480"/>
    <polygon points="580,100 680,480 750,480"/>
    <polygon points="580,100 850,480 940,480"/>
  </g>
  <!-- Alpine Twin Cascading Waterfalls (绝壁银练冰川双瀑布) -->
  <path d="M 380 260 Q 375 320 385 390 L 392 390 Q 382 320 388 260 Z" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <path d="M 800 240 Q 808 310 798 395 L 805 395 Q 815 310 808 240 Z" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <!-- Stepped Glacier Tarns: Lake 3 & Lake 5 (碧绿翡翠湖群) -->
  <ellipse cx="600" cy="445" rx="420" ry="55" fill="url(#lakeTurquoise)"/>
  <ellipse cx="600" cy="445" rx="300" ry="32" fill="#5eead4" opacity="0.7"/>
  <!-- Gentle Ripples -->
  <path d="M 280 435 Q 450 425 620 440 T 950 432" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 340 460 Q 520 450 700 465 T 880 455" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Mossy Granite Boulders & Alpine Flowers in foreground -->
  <ellipse cx="180" cy="475" rx="65" ry="32" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <path d="M 140 465 Q 180 445 220 465" fill="#65a30d" opacity="0.8"/>
  <ellipse cx="980" cy="475" rx="75" ry="35" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <path d="M 930 465 Q 980 445 1030 465" fill="#65a30d" opacity="0.8"/>
  <!-- Adorable Cute Alpine Marmot / Pika (萌趣雪山小土拨鼠) on rock -->
  <g transform="translate(160, 395)">
    <!-- Round chubby body -->
    <ellipse cx="30" cy="55" rx="22" ry="26" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="30" cy="58" rx="14" ry="18" fill="#fde68a"/>
    <!-- Head -->
    <circle cx="30" cy="28" r="16" fill="#b45309"/>
    <!-- Cute round ears -->
    <circle cx="18" cy="16" r="6" fill="#b45309"/>
    <circle cx="18" cy="16" r="3.5" fill="#fbcfe8"/>
    <circle cx="42" cy="16" r="6" fill="#b45309"/>
    <circle cx="42" cy="16" r="3.5" fill="#fbcfe8"/>
    <!-- Eyes -->
    <circle cx="24" cy="26" r="3" fill="#0f172a"/>
    <circle cx="25" cy="25" r="1" fill="#ffffff"/>
    <circle cx="36" cy="26" r="3" fill="#0f172a"/>
    <circle cx="37" cy="25" r="1" fill="#ffffff"/>
    <!-- Cute nose and buck teeth -->
    <ellipse cx="30" cy="32" rx="3" ry="2" fill="#78350f"/>
    <rect x="28" y="34" width="4" height="4" fill="#ffffff" rx="1"/>
    <!-- Paws holding a wild red flower -->
    <circle cx="22" cy="48" r="4" fill="#92400e"/>
    <circle cx="38" cy="48" r="4" fill="#92400e"/>
    <path d="M 30 48 L 30 38" stroke="#16a34a" stroke-width="2"/>
    <circle cx="30" cy="38" r="4.5" fill="#ef4444"/>
  </g>

  <!-- Top Badges -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="460" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="64" y="59" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="19" font-weight="800">💧 碧罗秘境 · 上帝眼泪翡翠湖群与萌趣雪山鼠</text>
    
    <rect x="1000" y="32" width="160" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="1080" y="59" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700">4,380m 九号湖垭口</text>
  </g>
  <!-- Bottom Glassmorphism Editorial Info Card -->
  <g filter="url(#shadow)">
    <rect x="28" y="492" width="1144" height="155" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.5"/>
    <rect x="28" y="492" width="1144" height="6" rx="3" fill="#f59e0b"/>
    <text x="56" y="542" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="30" font-weight="900">南极洛（阿尺打嘎）· 上帝遗落的眼泪 1–9号高山湖群</text>
    <text x="56" y="582" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700">D10 · 10/13 · 海拔 3,900m–4,380m · 碧罗雪山终极秘境</text>
    <text x="56" y="620" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18">💧 翡翠双湖同框 · 绝壁双瀑布群 · 丁达尔神光与岩畔小萌鼠</text>
  </g>
</svg>