<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="45%" stop-color="#581c87"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky7)"/>
  <!-- Natural Pyramid "Shambhala Natural Stupa" Peak (4,250m 香巴拉天然佛塔) -->
  <polygon points="600,100 420,310 780,310" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="600,100 680,260 600,310" fill="#fde047" opacity="0.6"/>
  <!-- Thousand-meter Vertical Canyon Cliffs (巴拉格宗绝壁千仞) -->
  <polygon points="0,0 280,0 360,450 0,480" fill="#18181b"/>
  <polygon points="1200,0 920,0 840,450 1200,480" fill="#18181b"/>
  <!-- Sky-Walk Cliffside Plank Road (回音壁高空栈道) -->
  <path d="M 850 300 Q 940 330 1050 320" stroke="#f59e0b" stroke-width="5" fill="none"/>
  <path d="M 850 306 Q 940 336 1050 326" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Bala Tibetan Village Stone Towers (千年巴拉村藏式碉房) -->
  <g transform="translate(480, 360)">
    <rect x="0" y="40" width="55" height="50" fill="#71717a" stroke="#3f3f46" stroke-width="2"/>
    <polygon points="-5,40 27,25 60,40" fill="#52525b"/>
    <rect x="65" y="25" width="70" height="65" fill="#a1a1aa" stroke="#52525b" stroke-width="2"/>
    <polygon points="60,25 100,8 140,25" fill="#71717a"/>
    <!-- Prayer flags on roof poles -->
    <line x1="27" y1="25" x2="27" y2="8" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="27" cy="8" r="3" fill="#ef4444"/>
    <line x1="100" y1="8" x2="100" y2="-8" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="100" cy="-8" r="3" fill="#3b82f6"/>
  </g>
  <!-- Sacred Thousand-Year Phoenix Bodhi Tree (千年凤凰菩提树) on cliff -->
  <g transform="translate(180, 280)">
    <!-- Tree Trunk spreading on cliff -->
    <path d="M 60 160 Q 40 100 80 50 Q 90 20 120 10" stroke="#78350f" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Spreading green canopy foliage -->
    <ellipse cx="120" cy="15" rx="35" ry="22" fill="#15803d"/>
    <ellipse cx="80" cy="55" rx="30" ry="18" fill="#16a34a"/>
    <ellipse cx="100" cy="40" rx="25" ry="15" fill="#22c55e"/>
    <!-- Golden magical handprint aura (神奇菩提手印) -->
    <circle cx="105" cy="42" r="14" fill="#fef08a" opacity="0.75" filter="url(#glow)"/>
    <text x="105" y="47" text-anchor="middle" font-size="12" fill="#78350f">✋</text>
  </g>

  <!-- Top Badges -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="460" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="64" y="59" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="19" font-weight="800">⛰️ 巴拉格宗 · 绝壁天路与天然金字塔佛塔</text>
    
    <rect x="1000" y="32" width="160" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="1080" y="59" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700">4,250m 香巴拉佛塔</text>
  </g>
  <!-- Bottom Glassmorphism Editorial Info Card -->
  <g filter="url(#shadow)">
    <rect x="28" y="492" width="1144" height="155" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.5"/>
    <rect x="28" y="492" width="1144" height="6" rx="3" fill="#f59e0b"/>
    <text x="56" y="542" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="30" font-weight="900">巴拉格宗大峡谷 · 千年康巴藏寨与天然香巴拉佛塔</text>
    <text x="56" y="582" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700">D7 · 10/10 · 海拔 2,100m–4,250m · 绝壁天路奇观</text>
    <text x="56" y="620" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18">⛰️ 4250m 天然金字塔佛塔 · 回音壁高空栈道 · 千年菩提手印与藏寨</text>
  </g>
</svg>