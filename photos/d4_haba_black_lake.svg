<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="85%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="blackLake" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="60%" stop-color="#021f1e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky4)"/>
  <!-- Haba Snow Mountain Crest (5,396m) -->
  <polygon points="180,360 480,90 620,240 780,130 980,310 1200,200 1200,430 0,430" fill="#f8fafc"/>
  <polygon points="480,90 530,220 440,240" fill="#99f6e4" opacity="0.6"/>
  <polygon points="780,130 830,230 750,250" fill="#99f6e4" opacity="0.6"/>
  <!-- Glacial Cirque & Dark Moraine Rocks -->
  <polygon points="0,410 250,330 520,380 840,320 1200,370 1200,460 0,460" fill="#134e4a"/>
  <!-- Mirror-Like Heihai Black Lake (哈巴黑海湖 4100m) -->
  <rect x="0" y="430" width="1200" height="90" fill="url(#blackLake)"/>
  <path d="M 100 460 Q 350 450 600 465 T 1100 458" stroke="#2dd4bf" stroke-width="2.5" fill="none" opacity="0.75"/>
  <path d="M 200 485 Q 500 475 800 490 T 1150 482" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Ancient Old-Growth Firs with hanging Usnea Lichen (原始冷杉与垂挂松萝) -->
  <g transform="translate(40, 230)">
    <!-- Tree 1 -->
    <polygon points="50,0 20,90 80,90" fill="#042f2e"/>
    <polygon points="50,60 15,140 85,140" fill="#042f2e"/>
    <polygon points="50,110 5,200 95,200" fill="#064e3b"/>
    <rect x="44" y="200" width="12" height="40" fill="#1c1917"/>
    <!-- Hanging green Usnea moss streamers -->
    <path d="M 22 135 Q 18 175 22 205" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 32 140 Q 28 185 30 220" stroke="#6ee7b7" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M 75 140 Q 80 180 76 215" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
  <!-- Sacred Tibetan Mani Stone Mound with White Hada (湖畔玛尼堆与哈达) -->
  <g transform="translate(900, 360)">
    <!-- Base stones -->
    <ellipse cx="60" cy="80" rx="45" ry="18" fill="#475569" stroke="#334155" stroke-width="2"/>
    <ellipse cx="30" cy="65" rx="35" ry="15" fill="#64748b" stroke="#475569" stroke-width="2"/>
    <ellipse cx="85" cy="65" rx="32" ry="14" fill="#475569" stroke="#334155" stroke-width="2"/>
    <ellipse cx="60" cy="50" rx="30" ry="13" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="60" cy="35" rx="22" ry="11" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="60" cy="22" rx="14" ry="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Flowing White Hada (纯洁哈达) draped over stones -->
    <path d="M 45 42 Q 60 48 75 42 Q 88 65 78 88" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.95"/>
  </g>
  <!-- Fluttering Five-Color Prayer Flags across the sky (五彩经幡: 蓝白红绿黄) -->
  <g transform="translate(180, 200)">
    <!-- Rope line -->
    <path d="M 0 50 Q 300 120 700 40" stroke="#f1f5f9" stroke-width="2" fill="none"/>
    <!-- Flags -->
    <!-- Blue (Sky) -->
    <polygon points="50,62 85,70 78,110 43,102" fill="#2563eb"/>
    <!-- White (Cloud) -->
    <polygon points="95,73 130,81 123,121 88,113" fill="#ffffff"/>
    <!-- Red (Fire) -->
    <polygon points="140,84 175,92 168,132 133,124" fill="#dc2626"/>
    <!-- Green (Water) -->
    <polygon points="185,93 220,99 213,139 178,133" fill="#16a34a"/>
    <!-- Yellow (Earth) -->
    <polygon points="230,101 265,105 258,145 223,141" fill="#eab308"/>
    <!-- Second cycle -->
    <polygon points="275,106 310,108 303,148 268,146" fill="#2563eb"/>
    <polygon points="320,109 355,109 348,149 313,149" fill="#ffffff"/>
    <polygon points="365,109 400,107 393,147 358,149" fill="#dc2626"/>
    <polygon points="410,106 445,102 438,142 403,146" fill="#16a34a"/>
    <polygon points="455,100 490,94 483,134 448,140" fill="#eab308"/>
  </g>

  <!-- Top Badges -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="460" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="64" y="59" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="19" font-weight="800">🥾 哈巴黑海湖 · 经幡玛尼堆与松萝</text>
    
    <rect x="1000" y="32" width="160" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="1080" y="59" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700">4,100m 黑海湖</text>
  </g>
  <!-- Bottom Glassmorphism Editorial Info Card -->
  <g filter="url(#shadow)">
    <rect x="28" y="492" width="1144" height="155" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.5"/>
    <rect x="28" y="492" width="1144" height="6" rx="3" fill="#f59e0b"/>
    <text x="56" y="542" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="30" font-weight="900">哈巴雪山黑海湖秘境徒步 · 原始冷杉松萝与玄冰湖</text>
    <text x="56" y="582" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700">D4 · 10/07 · 海拔 4,100m · 冰碛黑海与雪山倒影</text>
    <text x="56" y="620" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18">🥾 湖畔五彩经幡长廊 · 玛尼堆祈福 · 垂挂松萝原始冷杉林</text>
  </g>
</svg>