<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="tieDye" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky2)"/>
  <!-- Sunny Day Glow -->
  <circle cx="200" cy="130" r="55" fill="#fef08a" opacity="0.85"/>
  <circle cx="200" cy="130" r="95" fill="#fef08a" opacity="0.3"/>
  <!-- Jade Dragon 13 Snow Peaks Crisp White -->
  <polygon points="120,380 290,180 390,270 540,110 680,240 820,130 960,260 1120,150 1200,240 1200,420 120,420" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="540,110 590,210 510,250" fill="#93c5fd" opacity="0.45"/>
  <polygon points="820,130 870,220 800,240" fill="#93c5fd" opacity="0.45"/>
  <!-- Green Rolling Pasture Hills (香巴拉牧场) -->
  <path d="M 0 380 Q 250 330 550 365 T 1200 350 L 1200 520 L 0 520 Z" fill="#15803d"/>
  <path d="M 0 410 Q 350 370 700 400 T 1200 385 L 1200 520 L 0 520 Z" fill="#22c55e"/>
  <!-- White Cloud Puffs -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="420" cy="180" rx="60" ry="22"/>
    <ellipse cx="460" cy="170" rx="45" ry="25"/>
    <ellipse cx="380" cy="185" rx="40" ry="18"/>
  </g>
  <!-- Naxi Batik / Tie-Dye Textile Drying Racks (纳西扎染蓝印花布) -->
  <g transform="translate(180, 310)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#78350f" stroke-width="6"/>
    <line x1="160" y1="0" x2="160" y2="120" stroke="#78350f" stroke-width="6"/>
    <line x1="-15" y1="15" x2="175" y2="15" stroke="#92400e" stroke-width="5"/>
    <!-- Fluttering blue & white cloth sheets -->
    <path d="M 10 15 C 20 60, 5 95, 20 125 L 75 125 C 60 95, 75 60, 65 15 Z" fill="url(#tieDye)" opacity="0.95"/>
    <circle cx="42" cy="70" r="10" fill="#ffffff" opacity="0.8"/>
    <path d="M 85 15 C 95 60, 80 95, 95 125 L 150 125 C 135 95, 150 60, 140 15 Z" fill="url(#tieDye)" opacity="0.95"/>
    <circle cx="118" cy="70" r="10" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Adorable Fluffy Alpaca / Baby Yak (萌趣小羊驼) on the meadow -->
  <g transform="translate(760, 310)">
    <!-- Alpaca body -->
    <ellipse cx="100" cy="110" rx="55" ry="38" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Legs -->
    <rect x="65" y="130" width="14" height="42" rx="7" fill="#f1f5f9"/>
    <rect x="85" y="132" width="14" height="40" rx="7" fill="#e2e8f0"/>
    <rect x="115" y="130" width="14" height="42" rx="7" fill="#f1f5f9"/>
    <rect x="135" y="132" width="14" height="40" rx="7" fill="#e2e8f0"/>
    <!-- Long fluffy neck -->
    <path d="M 55 110 Q 50 60 62 25 L 92 25 Q 98 60 95 110 Z" fill="#f8fafc"/>
    <!-- Head -->
    <ellipse cx="75" cy="20" rx="26" ry="20" fill="#f8fafc"/>
    <!-- Cute ears -->
    <ellipse cx="60" cy="2" rx="6" ry="14" fill="#f8fafc" transform="rotate(-20 60 2)"/>
    <ellipse cx="60" cy="2" rx="3" ry="9" fill="#fbcfe8" transform="rotate(-20 60 2)"/>
    <ellipse cx="90" cy="2" rx="6" ry="14" fill="#f8fafc" transform="rotate(20 90 2)"/>
    <ellipse cx="90" cy="2" rx="3" ry="9" fill="#fbcfe8" transform="rotate(20 90 2)"/>
    <!-- Face details -->
    <circle cx="68" cy="18" r="4" fill="#0f172a"/>
    <circle cx="70" cy="16" r="1.5" fill="#ffffff"/>
    <circle cx="82" cy="18" r="4" fill="#0f172a"/>
    <circle cx="84" cy="16" r="1.5" fill="#ffffff"/>
    <!-- Smiling mouth & pink blush -->
    <path d="M 72 26 Q 75 30 78 26" stroke="#f43f5e" stroke-width="2" fill="none"/>
    <ellipse cx="62" cy="24" rx="4" ry="2.5" fill="#fda4af" opacity="0.7"/>
    <ellipse cx="88" cy="24" rx="4" ry="2.5" fill="#fda4af" opacity="0.7"/>
    <!-- Festive colorful neck ribbon & bells -->
    <path d="M 54 48 Q 75 60 96 48" stroke="#ef4444" stroke-width="8" fill="none"/>
    <circle cx="75" cy="56" r="6" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Little clover in mouth -->
    <path d="M 68 28 Q 50 25 45 32" stroke="#16a34a" stroke-width="2.5" fill="none"/>
    <circle cx="43" cy="32" r="5" fill="#22c55e"/>
    <circle cx="47" cy="35" r="4" fill="#16a34a"/>
  </g>
  <!-- Coffee Cup on Wooden Table (雪山下午茶) -->
  <g transform="translate(1000, 390)">
    <rect x="0" y="45" width="130" height="20" rx="5" fill="#78350f"/>
    <!-- Cup -->
    <path d="M 30 15 L 35 45 L 85 45 L 90 15 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 90 22 Q 106 28 90 38" stroke="#ffffff" stroke-width="4" fill="none"/>
    <ellipse cx="60" cy="15" rx="30" ry="8" fill="#92400e"/>
    <ellipse cx="60" cy="15" rx="22" ry="5" fill="#d97706"/>
    <!-- Latte art leaf -->
    <path d="M 48 15 Q 60 11 72 15 Q 60 17 48 15 Z" fill="#fef3c7"/>
    <!-- Steam -->
    <path d="M 52 5 Q 56 -5 52 -15" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 65 8 Q 69 -2 65 -12" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <!-- Top Badges -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="460" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="64" y="59" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="19" font-weight="800">☕ 白沙慢调 · 纳西扎染与萌宠牧场</text>
    
    <rect x="1000" y="32" width="160" height="42" rx="21" fill="#090d16" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="1080" y="59" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700">2,500m 雪山草甸</text>
  </g>
  <!-- Bottom Glassmorphism Editorial Info Card -->
  <g filter="url(#shadow)">
    <rect x="28" y="492" width="1144" height="155" rx="24" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.5"/>
    <rect x="28" y="492" width="1144" height="6" rx="3" fill="#f59e0b"/>
    <text x="56" y="542" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="30" font-weight="900">白沙古镇仰望玉龙十三峰 &amp; 香巴拉牧场/云栖壹号院</text>
    <text x="56" y="582" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700">D2 · 10/05 · 海拔 2,450m–2,600m · 纳西古王国慢调日</text>
    <text x="56" y="620" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18">☕ 白沙老街咖啡露台 · 扎染蓝印花布 · 萌宠小羊驼牧场</text>
  </g>
</svg>